---
configuration:
  email:
    name: Email
    description: The email address that will be registered for the certificate.
  accept_terms:
    name: Accept Terms
    description: Accept the ACME server Terms of Service.
  authenticators:
    name: Authenticators
    description: List of DNS authenticators and their credentials.
  certificates:
    name: Certificates
    description: List of certificates to manage.
  acme_server:
    name: Custom ACME Server
    description: >-
      By default, this app uses Let's Encrypt's servers. However, you can
      specify a different ACME server.
  acme_root_ca_cert:
    name: ACME Root CA Certificate
    description: >-
      Only relevant with a custom ACME server using a certificate signed by an
      untrusted certificate authority (CA) that requires addition to the trust
      store.
  dry_run:
    name: Dry Run
    description: >-
      Do a certbot dry-run for requesting the certificates from Let's Encrypt.
      This is ignored if a custom server is used.
  test_cert:
    name: Issue test certificates
    description: >-
      Obtain a test certificate from Let's Encrypt staging server.
      This is ignored if a custom server is used.
  verbose:
    name: Verbose Mode
    description: >-
      Run certbot in verbose mode.
  force_renew:
    name: Force Renew
    description: >-
      Force certificate renewal even if it is not close to expiry.
  eab_kid:
    name: EAB KID
    description: External Account Binding Key ID.
  eab_hmac_key:
    name: EAB HMAC Key
    description: External Account Binding HMAC Key.
network: {}
