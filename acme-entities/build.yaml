---
build_from:
  aarch64: ghcr.io/home-assistant/base-python:3.12-alpine3.23
  amd64: ghcr.io/home-assistant/base-python:3.12-alpine3.23
args:
  ACME_VERSION: 5.5.0
  # certbot-dns-multi replaces most individual DNS plugins using lego
  CERTBOT_DNS_MULTI_VERSION: 4.33.0
  # Azure and HE kept as legacy for backward compatibility
  # (provider supported by lego, will be removed in future version)
  CERTBOT_DNS_AZURE_VERSION: 2.5.0
  CERTBOT_VERSION: 5.5.0
  CRYPTOGRAPHY_VERSION: 46.0.7
